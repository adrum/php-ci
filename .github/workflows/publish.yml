name: Publish images

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Saturdays, to pick up PHP patch releases and base image updates.
    - cron: '0 6 * * 6'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: ${{ matrix.php }}${{ matrix.variant.suffix }} (${{ matrix.arch.name }})
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        variant:
          - { name: debian, suffix: '', base: '' }
          - { name: alpine, suffix: '-alpine', base: '-cli-alpine' }
        arch:
          - { name: amd64, runner: ubuntu-24.04 }
          - { name: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch.name }}
          pull: true
          # Weekly runs rebuild from scratch so OS packages and extensions are refreshed too.
          no-cache: ${{ github.event_name == 'schedule' }}
          load: true
          tags: php-ci:test
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            BASE_SUFFIX=${{ matrix.variant.base }}
          cache-from: type=gha,scope=${{ matrix.php }}${{ matrix.variant.suffix }}-${{ matrix.arch.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.php }}${{ matrix.variant.suffix }}-${{ matrix.arch.name }}

      - name: Smoke test
        run: docker run --rm -v "$PWD/tests:/tests:ro" php-ci:test sh /tests/smoke.sh

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch.name }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            BASE_SUFFIX=${{ matrix.variant.base }}
          cache-from: type=gha,scope=${{ matrix.php }}${{ matrix.variant.suffix }}-${{ matrix.arch.name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.php }}-${{ matrix.variant.name }}-${{ matrix.arch.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.php }}${{ matrix.variant.suffix }} (manifest)
    # Run even if other matrix builds failed; each manifest checks its own digests.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        variant:
          - { name: debian, suffix: '' }
          - { name: alpine, suffix: '-alpine' }
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.php }}-${{ matrix.variant.name }}-*
          merge-multiple: true
        continue-on-error: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          if [ "$(ls | wc -l)" -ne 2 ]; then
            echo "expected amd64 and arm64 digests, found: $(ls)" >&2
            exit 1
          fi
          docker buildx imagetools create \
            -t "$IMAGE:${{ matrix.php }}${{ matrix.variant.suffix }}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ matrix.php }}${{ matrix.variant.suffix }}"
